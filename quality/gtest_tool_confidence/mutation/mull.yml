# Base Mull configuration for the GoogleTest tool-confidence mutation run.
# run_mutation.sh copies this file and appends the includePaths of the
# requested scope. Changing the operator set changes the evidence: record the
# change in the GoogleTest Tool Verification Report.
mutators:
  - cxx_arithmetic
  - cxx_comparison
  - cxx_boundary
  - cxx_logical
  - cxx_remove_void_call
  - cxx_replace_scalar_call
excludePaths:
  - ".*_test\\.cpp$"
  - ".*/test/.*"
  - ".*/mock.*"
  - "external/.*"
  - ".*/external/.*"
